<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Hệ Thống Các Tiệm — Think's Kitchen: cơm phần, cơm tháng, đặc tiệc và kem. Đặt cơm online hoặc gọi 626-283-9994." />
    <link rel="icon" type="image/png" href="https://tastyexpress-ca.github.io/tuyen-giao/assets/favicon.png" />
<link rel="apple-touch-icon" href="https://tastyexpress-ca.github.io/tuyen-giao/assets/apple-touch-icon.png" />
<meta property="og:type" content="website" />
<meta property="og:title" content="Tasty Express — Hệ Thống Các Tiệm" />
<meta property="og:description" content="Think's Kitchen — Đặt cơm online. Order: 626-283-9994" />
<meta property="og:image" content="https://tastyexpress-ca.github.io/tuyen-giao/assets/logo-og.jpg" />
    <title>Tasty Express — Hệ Thống Các Tiệm</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root{
        --bg:#faf5ec;
        --card:#fffdf8;
        --ink:#26221a;
        --muted:#6b6252;
        --red:#b3352b;
        --red-deep:#8f2a22;
        --green:#1d6b3a;
        --green-deep:#155830;
        --line:#e4d9c4;
        --chip:#f5e7cd;
        --chip-line:#d9a441;
        --shadow:0 10px 26px rgba(64,48,20,.14);
      }
      @media (prefers-color-scheme: dark){
        :root{
          --bg:#16140f;
          --card:#201d16;
          --ink:#f0e9da;
          --muted:#b8ae99;
          --red:#c94f42;
          --red-deep:#b3352b;
          --green:#5cb87e;
          --green-deep:#7ccb97;
          --line:#38322a;
          --chip:#2c2517;
          --chip-line:#a07d2e;
          --shadow:0 10px 26px rgba(0,0,0,.5);
        }
      }
      *{box-sizing:border-box}
      body{
        margin:0;background:var(--bg);color:var(--ink);
        font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
        min-height:100svh;
        -webkit-font-smoothing:antialiased;
      }
      .wrap{max-width:760px;margin:0 auto;padding:20px 18px 48px}

      /* ---- Header ---- */
      header.site{
        display:flex;align-items:center;justify-content:space-between;gap:14px;
        padding:6px 0 18px;flex-wrap:wrap;
      }
      .brand{
        font-family:"Playfair Display","Be Vietnam Pro",serif;
        font-weight:800;font-size:1.35rem;letter-spacing:.01em;line-height:1.15;
      }
      .brand .accent{color:var(--red)}

      /* ---- Buttons ---- */
      .btn{
        display:inline-flex;align-items:center;justify-content:center;gap:8px;
        font-family:"Be Vietnam Pro",system-ui,sans-serif;
        font-weight:700;font-size:1rem;text-decoration:none;text-align:center;
        padding:14px 28px;border-radius:999px;min-height:52px;
        transition:transform .15s ease, background .15s ease, border-color .15s ease;
        -webkit-tap-highlight-color:transparent;
      }
      .btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
      .btn:active{transform:translateY(0)}
      .btn-order{
        background:var(--red);border:1px solid var(--red);color:#fff;
        box-shadow:var(--shadow);
      }
      .btn-order:hover{background:var(--red-deep);transform:translateY(-1px)}
      .btn-call{
        background:transparent;border:1.5px solid var(--green);color:var(--green);
      }
      .btn-call:hover{border-color:var(--green-deep);color:var(--green-deep);transform:translateY(-1px)}
      .btn-sm{padding:11px 22px;min-height:46px;font-size:.95rem}

      /* ---- Shop card ---- */
      .shop-card{
        background:var(--card);border:1px solid var(--line);border-radius:20px;
        box-shadow:var(--shadow);
        padding:30px 28px 34px;
      }
      .chip{
        display:inline-block;background:var(--chip);
        border:1px solid var(--chip-line);color:var(--ink);
        font-size:.82rem;font-weight:600;
        padding:6px 14px;border-radius:999px;margin-bottom:16px;
      }
      .shop-name{
        font-family:"Playfair Display","Be Vietnam Pro",serif;
        font-weight:800;font-size:2.3rem;line-height:1.1;margin:0 0 10px;
      }
      .tagline{
        color:var(--green);font-weight:700;font-size:1.2rem;line-height:1.4;
        margin:0 0 18px;
      }
      .intro{color:var(--muted);font-size:1.05rem;line-height:1.65;margin:0 0 24px}

      .info-list{list-style:none;margin:0 0 28px;padding:0;display:grid;gap:14px}
      .info-list li{display:flex;align-items:flex-start;gap:12px;font-size:1.05rem;line-height:1.45}
      .info-list svg{flex:0 0 auto;width:22px;height:22px;color:var(--green);margin-top:1px}
      .info-list .phone{font-weight:700;color:var(--green);text-decoration:none;white-space:nowrap}
      .info-list .phone:hover{text-decoration:underline}

      .card-actions{display:flex;gap:14px;flex-wrap:wrap}
      .card-actions .btn{flex:1 1 200px}

      @media (max-width:480px){
        .wrap{padding:16px 14px 40px}
        .shop-card{padding:24px 20px 28px}
        .shop-name{font-size:1.9rem}
        .tagline{font-size:1.1rem}
        header.site .btn-order{padding:10px 18px;font-size:.9rem}
      }
      .app-promo{background:linear-gradient(135deg,#fdf3e3,#fde8d8);border:1.5px solid #f0c48f;border-radius:16px;padding:16px 18px;margin-bottom:18px}
      .app-promo h2{font-size:1.15rem;margin-bottom:6px;color:#8a4b12}
      .app-promo p{color:#6b4a2a;line-height:1.55;margin-bottom:12px}
      @media (prefers-reduced-motion: reduce){ .btn{transition:none} }
    </style>
  </head>
  <body>
    <div class="wrap">

      <main>
          <div class="app-promo">
            <h2>📱 Tasty Express — Nơi hội tụ món ngon Bolsa</h2>
            <p>Tasty Express là nơi bạn có thể lựa chọn những món ăn thuần tuý Việt từ những nhà hàng nổi tiếng ở Bolsa — và được giao đến tận nơi.</p>
            <div class="card-actions">
              <a class="btn btn-order" href="https://tastyexpress-ca.github.io/tuyen-giao/dat-com/?login=1">Đăng nhập</a>
              <a class="btn btn-call" href="../cac-tiem/">Tiếp tục với khách</a>
            </div>
          </div>
      </main>
    </div>
  </body>
</html>

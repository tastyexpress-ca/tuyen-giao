function b64d(s){ var bin = atob(s); var b = new Uint8Array(bin.length); for (var i=0;i<bin.length;i++) b[i]=bin.charCodeAt(i); return b; }
async function unlock(pw){
  var enc = new TextEncoder();
  var base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
  var key = await crypto.subtle.deriveKey({name:'PBKDF2', salt: b64d(DATA.s), iterations: DATA.n, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  var pt = await crypto.subtle.decrypt({name:'AES-GCM', iv: b64d(DATA.i)}, key, b64d(DATA.c));
  try { localStorage.setItem('te-driver-pw', pw); } catch(e) {}
  var html = new TextDecoder().decode(pt);
  document.open(); document.write(html); document.close();
}
document.getElementById('f').addEventListener('submit', function(ev){
  ev.preventDefault();
  var pw = document.getElementById('pw').value;
  unlock(pw).catch(function(){
    document.getElementById('err').textContent = 'Sai mật khẩu, anh thử lại nhé';
    try { localStorage.removeItem('te-driver-pw'); } catch(e) {}
  });
});
(function(){
  var saved = null;
  try { saved = localStorage.getItem('te-driver-pw'); } catch(e) {}
  if (saved) {
    unlock(saved).catch(function(){
      try { localStorage.removeItem('te-driver-pw'); } catch(e) {}
    });
  }
})();
